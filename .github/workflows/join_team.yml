name: Join team

on:
  workflow_dispatch:
    inputs:
      github_handle:
        description: "GitHub handle to add to the team"
        required: true
        type: string

permissions: {}

jobs:
  join-team:
    name: Add ${{ inputs.github_handle }} to ek-2026
    runs-on: ubuntu-latest
    env:
      ORG: kea-dev
      TEAM_SLUG: ek-2026
      HANDLE: ${{ inputs.github_handle }}
      GH_TOKEN: ${{ secrets.ORG_TEAM_ADMIN }} # needs admin:org (classic) or org Members: write
    steps:
      - name: Validate handle
        run: |
          if [[ ! "$HANDLE" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,38})$ ]]; then
            echo "::error title=Invalid handle::'$HANDLE' is not a valid GitHub handle"
            {
              echo "## ❌ Join team failed"
              echo "'$HANDLE' is not a valid GitHub handle."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Add user to team
        run: |
          if ! result=$(gh api -X PUT "orgs/$ORG/teams/$TEAM_SLUG/memberships/$HANDLE" \
            -f role=member --jq '.state' 2>&1); then
            echo "::error title=Join team failed::$result"
            {
              echo "## ❌ Join team failed"
              echo "Could not add **$HANDLE** to **$ORG/$TEAM_SLUG**."
              echo
              echo '```'
              echo "$result"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ "$result" == "pending" ]]; then
            msg="Invitation sent. **$HANDLE**, go to https://github.com/settings/organizations and accept the invitation to **$ORG**."
            echo "::notice title=Invitation sent::$HANDLE: go to https://github.com/settings/organizations and accept the invitation to $ORG"
            icon="📨"
          else
            msg="**$HANDLE** is now an active member of **$ORG/$TEAM_SLUG**."
            echo "::notice title=Added to team::$HANDLE is now a member of $ORG/$TEAM_SLUG"
            icon="✅"
          fi

          {
            echo "## $icon Join team"
            echo
            echo "$msg"
            echo
            echo "| Handle | Organization | Team | State |"
            echo "| --- | --- | --- | --- |"
            echo "| $HANDLE | $ORG | $TEAM_SLUG | $result |"
          } >> "$GITHUB_STEP_SUMMARY"
